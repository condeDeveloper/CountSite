<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Jogo do dinossauro (Python)</title>
<style>
  /* Réplica da janela que o dino.py abre (tkinter). O jogo segue a mesma lógica do código Python, passo por passo. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0b14; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 10px; user-select: none; }
  .janela { width: min(640px, 100%); border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid #555; box-shadow: 0 24px 50px -20px #000, 0 0 0 1px rgba(75,139,190,.45), 0 0 28px -8px rgba(255,212,59,.5); }
  .titulo { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 0 0 12px; background: #2b2b2b; color: #ddd; font-size: 13px; }
  .titulo span { flex: 1; }
  .titulo i { width: 40px; height: 34px; display: grid; place-items: center; font-style: normal; color: #aaa; font-size: 13px; }
  .palco { position: relative; line-height: 0; }
  canvas { display: block; width: 100%; height: auto; background: #fff; touch-action: manipulation; }
  .comecar { position: absolute; inset: 0; margin: auto; width: 150px; height: 52px; border: 0; border-radius: 26px; background: #306998; color: #ffd43b; font: 700 18px 'Segoe UI', system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 22px -8px rgba(0,0,0,.6); }
  body.rodando .comecar, body.demo .comecar, body.demo .barra { display: none; }
  .barra { color: #b9b4cc; font-size: 14px; text-align: center; }
  .barra b { color: #ffd43b; }
</style>
</head>
<body>
  <div class="janela" role="application" aria-label="Janela do jogo do dinossauro em Python">
    <div class="titulo"><span>Jogo do dinossauro</span><i>─</i><i>☐</i><i>✕</i></div>
    <div class="palco">
      <canvas id="tela" width="600" height="200"></canvas>
      <button class="comecar" id="comecar" type="button">▶ Jogar</button>
    </div>
  </div>
  <div class="barra"><b>Espaço</b>, seta pra cima ou toque na tela pra pular</div>
<script>
  // A mesma lógica do dino.py: as mesmas medidas, a mesma gravidade, os mesmos cactos e a mesma regra de batida.
  const L = 600, A = 200, CHAO = 160, P = 4
  const DINO = ['      #### ', '      # ###', '      #####', '#    ###   ', '##  #####  ', ' ######    ', '  #####    ']
  const PERNAS = ['  #  #     ', '   # #     ']
  const g = document.getElementById('tela').getContext('2d')
  const demo = new URLSearchParams(location.search).get('demo') === '1'
  let y, vel, cactos, pontos, ritmo, folga, vivo, rodando = demo
  const sorteia = (a, b) => a + Math.floor(Math.random() * (b - a + 1))

  function novo() { y = CHAO; vel = 0; cactos = []; pontos = 0; ritmo = 6; folga = 0; vivo = true }
  function pula() { if (!vivo) novo(); else if (y === CHAO) vel = -13 }
  function passo() {
    if (vivo && rodando) {
      vel += 1
      y = Math.min(CHAO, y + vel)
      if (!cactos.length || cactos[cactos.length - 1][0] < L - folga) { cactos.push([L, [24, 32, 40][sorteia(0, 2)]]); folga = sorteia(280, 480) }
      for (const c of cactos) c[0] -= ritmo
      cactos = cactos.filter((c) => c[0] > -20)
      pontos += 1
      ritmo = Math.min(11, 6 + Math.floor(pontos / 300))
      vivo = !cactos.some((c) => c[0] < 76 && c[0] + 14 > 44 && y > CHAO - c[1])
    }
    if (demo) { const c = cactos.find((c) => c[0] + 14 > 44); if (!vivo) novo(); else if (c && c[0] < 76 + ritmo * 9 && y === CHAO) pula() }
    desenha()
  }
  const bloco = (x, y0, w, h) => g.fillRect(x, y0, w, h)
  function desenha() {
    g.clearRect(0, 0, L, A); g.fillStyle = '#535353'
    bloco(0, CHAO, L, 2)
    const corpo = DINO.concat([PERNAS[y === CHAO ? Math.floor(pontos / 6) % 2 : 0]])
    corpo.forEach((linha, i) => { for (let j = 0; j < linha.length; j++) if (linha[j] === '#') bloco(40 + j * P, y - (corpo.length - i) * P, P, P) })
    for (const [x, h] of cactos) { bloco(x + 4, CHAO - h, 6, h); bloco(x, CHAO - h * 0.45, 14, 3); bloco(x, CHAO - h * 0.75, 3, h * 0.3); bloco(x + 11, CHAO - h * 0.85, 3, h * 0.4) }
    g.font = '14px Consolas, monospace'; g.textAlign = 'right'; g.fillText(String(Math.floor(pontos / 5)).padStart(5, '0'), L - 12, 23)
    if (!vivo) { g.textAlign = 'center'; g.font = 'bold 18px Consolas, monospace'; g.fillText('FIM DE JOGO', L / 2, 76); g.font = '11px Consolas, monospace'; g.fillText('espaço ou toque para jogar de novo', L / 2, 100) }
  }
  function aperta(e) { if (e) e.preventDefault(); if (!rodando) { rodando = true; document.body.classList.add('rodando'); return } pula() }
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.key === 'ArrowUp') aperta(e) })
  document.querySelector('.palco').addEventListener('pointerdown', aperta)
  if (demo) document.body.classList.add('demo')
  novo(); desenha(); setInterval(passo, 20)
</script>
</body>
</html>
