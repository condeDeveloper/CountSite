<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Controle financeiro em SQL</title>
<link rel="stylesheet" href="../terminal.css" />
<style>
  .acoes { display: flex; gap: 6px; }
  .acoes button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font: 700 13px system-ui, sans-serif; cursor: pointer; background: #4b8dff; color: #fff; }
  .acoes button:disabled { opacity: .5; }
  table { border-collapse: collapse; margin: 4px 0 12px; font: 13px Consolas, 'Cascadia Code', ui-monospace, monospace; }
  th, td { border: 1px solid #333; padding: 4px 10px; text-align: left; }
  th { background: #1f2a44; color: #9cdcfe; }
  td.num { text-align: right; }
</style>
</head>
<body style="--neon:#4b8dff">
  <div class="term" id="t">
    <div class="term-barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>sqlite3 financeiro.db &lt; financeiro.sql</span></div>
    <div class="term-saida" id="saida"></div>
    <div class="term-entrada" hidden><span class="term-rotulo"></span><input type="text" /></div>
  </div>
  <div class="acoes"><button type="button" id="rodar" disabled>Carregando o SQLite…</button></div>
  <p class="nota">O financeiro.sql de verdade, rodando num banco SQLite aqui mesmo no navegador.</p>
<script src="../terminal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
  const t = Terminal(document.getElementById('t'))
  const saida = document.getElementById('saida')
  const rodar = document.getElementById('rodar')
  const fmt = (v) => (typeof v === 'number' ? v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : v)
  function tabela(r) {
    const tb = document.createElement('table')
    tb.innerHTML = `<tr>${r.columns.map((c) => `<th>${c}</th>`).join('')}</tr>` +
      r.values.map((l) => `<tr>${l.map((v) => `<td class="${typeof v === 'number' ? 'num' : ''}">${fmt(v)}</td>`).join('')}</tr>`).join('')
    saida.appendChild(tb)
    saida.scrollTop = saida.scrollHeight
  }
  t.escreve('Toca em ▶ Rodar pra criar a tabela, lançar o mês e responder: quanto sobrou e pra onde foi o dinheiro.', 'fraco')
  Promise.all([
    initSqlJs({ locateFile: (f) => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` }),
    fetch('financeiro.sql').then((r) => r.text()),
  ]).then(([SQL, codigo]) => {
    rodar.disabled = false
    rodar.textContent = '▶ Rodar financeiro.sql'
    rodar.addEventListener('click', async () => {
      rodar.disabled = true
      t.limpa()
      const db = new SQL.Database()
      const comandos = codigo.split(';').map((c) => c.trim()).filter(Boolean)
      for (const c of comandos) {
        const primeira = c.split('\n')[0]
        t.escreve('sqlite> ' + primeira + (c.includes('\n') ? ' …' : ''), 'cmd')
        await t.espera(350)
        const res = db.exec(c)
        if (res.length) res.forEach(tabela)
        else t.escreve(/^insert/i.test(c) ? `${db.getRowsModified()} lançamentos gravados.` : 'ok', 'ok')
      }
      db.close()
      rodar.disabled = false
      rodar.textContent = '↻ Rodar de novo'
    })
  }).catch(() => {
    rodar.textContent = 'Sem conexão pra carregar o SQLite'
  })
</script>
</body>
</html>
