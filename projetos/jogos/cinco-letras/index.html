<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Jogo das cinco letras (Python)</title>
<link rel="stylesheet" href="../terminal.css" />
<style>
  .fichas { display: flex; gap: 5px; margin: 4px 0 8px; }
  .fichas b { width: 38px; height: 38px; border-radius: 6px; display: grid; place-items: center; color: #fff; font: 800 19px Consolas, 'Cascadia Code', ui-monospace, monospace; animation: vira .3s ease-out both; }
  .fichas .V { background: #2ea44f; } .fichas .A { background: #c9a227; } .fichas .C { background: #5a5f66; }
  @keyframes vira { from { transform: scaleY(.1); opacity: .2 } to { transform: none; opacity: 1 } }
  .acoes { display: flex; gap: 6px; }
  .acoes button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font: 700 13px system-ui, sans-serif; cursor: pointer; background: #ffd43b; color: #111; }
  .legenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 11.5px; color: #8b8b9a; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
</style>
</head>
<body style="--neon:#ffd43b">
  <div class="term" id="t">
    <div class="term-barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>python termo.py</span></div>
    <div class="term-saida"></div>
    <div class="term-entrada" hidden><span class="term-rotulo"></span><input type="text" autocomplete="off" autocapitalize="characters" maxlength="12" /><button type="button">OK</button></div>
  </div>
  <div class="legenda"><span><i style="background:#2ea44f"></i>lugar certo</span><span><i style="background:#c9a227"></i>existe em outro lugar</span><span><i style="background:#5a5f66"></i>não tem</span></div>
  <div class="acoes" id="acoes" hidden><button type="button" id="denovo">↻ Outra palavra</button></div>
<script src="../terminal.js"></script>
<script>
  // A mesma regra do termo.py: duas passadas. Primeiro o que está no lugar certo (verde), depois o que sobrou (amarelo).
  const PALAVRAS = ['TERMO', 'CARTA', 'PORTA', 'LIVRO', 'NUVEM', 'PRAIA', 'SENHA', 'TECLA', 'VIDRO', 'FESTA', 'BANCO', 'CAMPO']
  function cores(chute, certa) {
    const cor = Array(5).fill('C'), sobra = [...certa]
    for (let i = 0; i < 5; i++) if (chute[i] === certa[i]) { cor[i] = 'V'; sobra.splice(sobra.indexOf(chute[i]), 1) }
    for (let i = 0; i < 5; i++) if (cor[i] === 'C' && sobra.includes(chute[i])) { cor[i] = 'A'; sobra.splice(sobra.indexOf(chute[i]), 1) }
    return cor
  }
  const t = Terminal(document.getElementById('t'))
  const soLetras = (s) => /^[A-Za-zÀ-ú]{5}$/.test(s)
  function pinta(chute, cor) {
    const d = t.escreve('', 'fichas')
    d.innerHTML = [...chute].map((l, i) => `<b class="${cor[i]}" style="animation-delay:${i * 90}ms">${l}</b>`).join('')
  }
  async function joga(certa) {
    for (let vez = 1; vez <= 6; vez++) {
      let chute = (await t.pergunta(`Tentativa ${vez} de 6: `)).trim().toUpperCase()
      while (!soLetras(chute)) chute = (await t.pergunta('Digite 5 letras: ')).trim().toUpperCase()
      pinta(chute, cores(chute, certa))
      await t.espera(550)
      if (chute === certa) { t.escreve(`Acertou em ${vez}!`, 'ok'); return }
    }
    t.escreve('A palavra era ' + certa, 'erro')
  }
  async function partida() {
    document.getElementById('acoes').hidden = true
    t.limpa()
    t.escreve('$ python termo.py', 'cmd')
    await joga(PALAVRAS[Math.floor(Math.random() * PALAVRAS.length)])
    document.getElementById('acoes').hidden = false
  }
  document.getElementById('denovo').addEventListener('click', partida)
  partida()
</script>
</body>
</html>
